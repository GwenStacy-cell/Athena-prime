name: Auto Deploy to Pterodactyl

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Pterodactyl Restart
    runs-on: ubuntu-latest
    steps:
      - name: Send Restart Signal to Pterodactyl
        run: |
          # Strip trailing slash if user included one
          PANEL_URL=$(echo "${{ secrets.PTERO_URL }}" | sed 's:/*$::')
          
          STATUS=$(curl -s -o response.txt -w "%{http_code}" -X POST "${PANEL_URL}/api/client/servers/${{ secrets.PTERO_SERVER_ID }}/power" \
            -H "Authorization: Bearer ${{ secrets.PTERO_API_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"signal": "restart"}')
          
          if [ "$STATUS" -eq 204 ] || [ "$STATUS" -eq 200 ]; then
            echo "Successfully sent restart command to Pterodactyl! Server will now pull latest code and boot."
          else
            echo "Error triggering server restart. HTTP status code: $STATUS"
            cat response.txt
            exit 1
          fi
